<!doctype html>
<html lang="zh-Hant">
	<head>
		<div id="metadata"></div>
		<link rel="stylesheet" href="./source/styles/global.css">
		<script src="./routing.js"></script>
        <title>2TWu.github.io</title>
	</head>
	<body>
		<div id="header"></div>


		<main id="content"></main>


		<div id="footer"></div>

        <script>
            // 使用 fetch 讀取 header.html 並塞入 #header
            fetch('./source/components/header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header').innerHTML = data;
                });
                    fetch('./source/components/metadata.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('metadata').innerHTML = data;
                });
                    fetch('./source/components/footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer').innerHTML = data;
                });
        </script>


		<script src="./source/js/routing.js"></script>
	</body>
</html>
