<!doctype html>
<html lang="zh-Hant">
	<head>
		<div id="metadata"></div>
		<link rel="stylesheet" href="./source/styles/global.css">
	</head>
	<body>
		<div id="header"></div>
		<main>
			<h1>🧑‍🚀 Helo 我是 2TWu</h1>
			<p>
				歡迎來到我的個人網頁，我是2TWu，這裡展示了一些我的作品集，包含lab的練習.個人筆記.CTF.還有一些APP的開發.
				不管你是想要瀏覽我的作品或者是LAB&CTF的紀錄都可以在這上面找到.
				下方會有這個網站的導覽，希望能幫助來到這個網站的你.
			</p>
		</main>


		<div id="footer"></div>

    <script>
        // 使用 fetch 讀取 header.html 並塞入 #header
        fetch('./source/components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });
				fetch('./source/components/metadata.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('metadata').innerHTML = data;
            });
				fetch('./source/components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });
    </script>
	</body>
</html>
